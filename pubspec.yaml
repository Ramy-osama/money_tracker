name: money_tracker
description: A personal money tracker with SMS auto-tracking and voice input.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  speech_to_text: ^7.0.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  csv: ^6.0.0
  uuid: ^4.5.1
  another_telephony: ^0.4.1
  sqflite_common_ffi_web: ^1.1.1
  flutter_local_notifications: ^21.0.0
  google_generative_ai: ^0.4.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
